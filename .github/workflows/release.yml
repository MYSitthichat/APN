name: Build & Publish APN Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests
        run: |
          go vet ./...
          go test -v ./...

      - name: Build all 7 cross-platform APN binaries
        env:
          CGO_ENABLED: "0"
          RDV_URL: "https://rdv.psms-center.com"
        run: |
          mkdir -p release-dist
          VER="${GITHUB_REF_NAME#v}"
          if [ -z "$VER" ] || [ "$GITHUB_REF_TYPE" != "tag" ]; then
            VER=$(grep -oP 'Version\s*=\s*"\K[^"]+' internal/version/version.go)
          fi
          echo "VERSION=$VER" >> "$GITHUB_ENV"

          BASE_LD="-s -w -X relayvpn/internal/config.DefaultRendezvousURL=${RDV_URL}"

          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-H=windowsgui ${BASE_LD}" -o "release-dist/APN-v${VER}-windows-amd64.exe" ./cmd/relayvpn
          GOOS=windows GOARCH=arm64 go build -trimpath -ldflags="-H=windowsgui ${BASE_LD}" -o "release-dist/APN-v${VER}-windows-arm64.exe" ./cmd/relayvpn
          GOOS=linux   GOARCH=amd64 go build -trimpath -ldflags="${BASE_LD}" -o "release-dist/APN-v${VER}-linux-amd64" ./cmd/relayvpn
          GOOS=linux   GOARCH=arm64 go build -trimpath -ldflags="${BASE_LD}" -o "release-dist/APN-v${VER}-linux-arm64" ./cmd/relayvpn
          GOOS=linux   GOARCH=arm GOARM=7 go build -trimpath -ldflags="${BASE_LD}" -o "release-dist/APN-v${VER}-linux-armv7" ./cmd/relayvpn
          GOOS=darwin  GOARCH=arm64 go build -trimpath -ldflags="${BASE_LD}" -o "release-dist/APN-v${VER}-macos-arm64" ./cmd/relayvpn
          GOOS=darwin  GOARCH=amd64 go build -trimpath -ldflags="${BASE_LD}" -o "release-dist/APN-v${VER}-macos-amd64" ./cmd/relayvpn

          go run ./scripts/mkdeb -bin "release-dist/APN-v${VER}-linux-amd64" -icon "internal/webui/static/logo.png" -version "${VER}" -arch amd64 -out "release-dist/APN-v${VER}-linux-amd64.deb"
          go run ./scripts/mkdeb -bin "release-dist/APN-v${VER}-linux-arm64" -icon "internal/webui/static/logo.png" -version "${VER}" -arch arm64 -out "release-dist/APN-v${VER}-linux-arm64.deb"
          go run ./scripts/mkdeb -bin "release-dist/APN-v${VER}-linux-armv7" -icon "internal/webui/static/logo.png" -version "${VER}" -arch armhf -out "release-dist/APN-v${VER}-linux-armv7.deb"

          (cd release-dist && sha256sum APN-v* > SHA256SUMS.txt)
          ls -lh release-dist

      - name: Extract Release Notes & Generate latest.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          NOTES=$(git tag -l --format='%(contents)' "${GITHUB_REF_NAME}")
          if [ -n "$NOTES" ]; then
            printf '%s\n' "$NOTES" > release-notes.md
          else
            printf 'APN %s release\n' "${GITHUB_REF_NAME}" > release-notes.md
          fi
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          ver = os.environ["VERSION"]
          notes = pathlib.Path("release-notes.md").read_text(encoding="utf-8").strip()
          base = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/v{ver}"
          mapping = {
            "windows-amd64": f"APN-v{ver}-windows-amd64.exe",
            "windows-arm64": f"APN-v{ver}-windows-arm64.exe",
            "linux-amd64":   f"APN-v{ver}-linux-amd64",
            "linux-arm64":   f"APN-v{ver}-linux-arm64",
            "linux-armv7":   f"APN-v{ver}-linux-armv7",
            "darwin-arm64":  f"APN-v{ver}-macos-arm64",
            "darwin-amd64":  f"APN-v{ver}-macos-amd64",
          }
          assets = {}
          for k, fname in mapping.items():
            p = pathlib.Path("release-dist") / fname
            if p.exists():
              h = hashlib.sha256(p.read_bytes()).hexdigest()
              assets[k] = {"url": f"{base}/{fname}", "sha256": h}
          manifest = {"version": ver, "release_notes": notes, "assets": assets}
          pathlib.Path("release-dist/latest.json").write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding="utf-8")
          PY

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          generate_release_notes: false
          files: |
            release-dist/APN-v*
            release-dist/SHA256SUMS.txt
            release-dist/latest.json
