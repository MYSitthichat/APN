# Cloudflare Worker for the APN Rendezvous directory (rdv.psms-center.com).
# Deploy:   cd cloudflare-worker; npx wrangler deploy
# Rollback: npx wrangler rollback
name = "relayvpn-rdv"
main = "rendezvous-worker.js"
compatibility_date = "2024-09-23"
workers_dev = false
preview_urls = false

routes = [
  { pattern = "rdv.psms-center.com", custom_domain = true }
]

[[kv_namespaces]]
binding = "PEERS"
id = "33745e1846ff4a75ae59d37c542978dc"
